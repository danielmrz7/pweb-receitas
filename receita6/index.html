<!DOCTYPE html>
<html>   
   <head>
      <meta charset="UTF-8">
      <title>Receita 6 - Objetos JSON</title>
      <style>
         body {
            font-family: Arial, sans-serif;
            padding: 20px;
         }
         table {
            border-collapse: collapse;
            width: 100%;
            max-width: 600px;
            margin-top: 15px;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
         }
         th {
            background-color: #2c3e50;
            color: white;
            padding: 12px;
            text-align: left;
         }
         td {
            border: 1px solid #ddd;
            padding: 12px;
         }
         tr:nth-child(even) {
            background-color: #f9f9f9;
         }
         button {
            padding: 10px 15px;
            cursor: pointer;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
         }
         button:hover {
            background-color: #d35400;
         }
      </style>
   </head>

   <body>
      <div><button id="botaoCarregar">Carregando cervejas...</button></div>
      
      <div id="cervejasDiv"></div>            
   </body>   
   
   <script>
      let cervejas = [
         {
            name: "Guinness", 
            alcohol: "10%",
            style: "Imperial Stout",
            ibu: "45"
         }, 
         {
            name: "Desperados",
            alcohol: "6%",
            style: "Cream Ale",
            ibu: "15"
         }, 
         {
            name: "Becks",
            alcohol: "5%",
            style: "Pilsen",
            ibu: "20"
         }
      ]
    
      const carregarDiv = (
         cs, 
         idAlvo = "cervejasDiv", 
         cabecalhos = ["Nome", "Álcool", "Estilo", "Amargor"], 
         propriedades = ["name", "alcohol", "style", "ibu"]
      ) => {
         
         const div = document.getElementById(idAlvo);
         
         const linhaCabecalho = `<tr>${cabecalhos.map(cab => `<th>${cab}</th>`).join("")}</tr>`;
         
         const itensHtml = cs.map(item => {
            const colunas = propriedades.map(prop => `<td>${item[prop]}</td>`).join("");
            return `<tr>${colunas}</tr>`;
         }); 
         
         div.innerHTML = `<table>${linhaCabecalho}${itensHtml.join("\n")}</table>`;
      }

      let botao = document.getElementById("botaoCarregar");
      
      botao.addEventListener("click", () => carregarDiv(cervejas));                 
   </script>
</html>
