<!DOCTYPE html>
<html>   
   <head>
      <meta charset="UTF-8">
      <title>Receita 5 - Arrow Functions e Callbacks</title>
      
      <style>
         body {
            font-family: Arial, sans-serif;
            padding: 20px;
         }

         table {
            border-collapse: collapse;
            width: 300px;
            margin-top: 15px;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.1);
         }
         
         th {
            background-color: #ff6699;
            color: white;
            padding: 10px;
            text-align: left;
         }
         
         td {
            border: 1px solid #ccc;
            padding: 10px;
            background-color: #fff0f5;
         }

         .controles {
            margin-bottom: 20px;
         }
         .link-acao {
            display: inline-block;
            padding: 10px 15px;
            margin-right: 10px;
            cursor: pointer;
            background-color: #ff6699;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
         }
         .link-acao:hover {
            background-color: #e65c8a;
         }
      </style>
   </head>
   
   <body>
      <div class="controles">
         <a href="#" id="linkCarregar" class="link-acao">Carregar Sorvetes</a>
         <a href="#" id="linkOrdenar" class="link-acao">Ordenar</a>
         <a href="#" id="linkEmbaralhar" class="link-acao">Embaralhar</a>
      </div>            
      
      <div id="meu amor"></div>
   </body>   
   
   <script>
      let sorvetes = ["Flocos", "Morango", "Chocolate", "Napolitano", "Pistache", "Baunilha"];
      
      const carregarDiv = (lista) => {
         const div = document.getElementById("meu amor");
         
         const sorvetesHtml = lista.map(item => `<tr><td>${item}</td></tr>`);
         
         div.innerHTML = `
            <table>
               <tr><th>Sabores de Sorvete</th></tr>
               ${sorvetesHtml.join("\n")}
            </table>
         `;
      };

      const ordenar = () => {
         sorvetes.sort();
         carregarDiv(sorvetes);
      };

      const embaralhar = () => {
         sorvetes.sort(() => Math.random() - 0.5);
         carregarDiv(sorvetes); 
      };
      
      const linkCarregar = document.getElementById("linkCarregar");
      const linkOrdenar = document.getElementById("linkOrdenar");
      const linkEmbaralhar = document.getElementById("linkEmbaralhar");

      linkCarregar.addEventListener("click", (e) => {
         e.preventDefault();
         carregarDiv(sorvetes); 
      });

      linkOrdenar.addEventListener("click", (e) => {
         e.preventDefault();
         ordenar();
      });

      linkEmbaralhar.addEventListener("click", (e) => {
         e.preventDefault();
         embaralhar();
      });

   </script>
</html>
